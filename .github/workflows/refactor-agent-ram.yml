name: Refactor Dark Net agent RAM
on:
  push:
    paths:
      - '.github/workflows/refactor-agent-ram.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor and validate
        run: python3 .github/refactor-darknet.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add darknet-manager.js
          git commit -m 'Reduce Dark Net crawler RAM below gateway limit'
          git push

name: Refactor Dark Net agent RAM
on:
  push:
    paths:
      - '.github/workflows/refactor-agent-ram.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor generated workers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('darknet-manager.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const VERSION = "1.0.2";', 'const VERSION = "1.0.3";', 1)

          # Add lightweight helper filenames in both manager and generated agent constants.
          s = s.replace('const PHISH = "/Temp/dnet-phish.js";\n    const RAM_WORKER',
                        'const PHISH = "/Temp/dnet-phish.js";\n    const PHISH_LAUNCHER = "/Temp/dnet-phish-launcher.js";\n    const RAM_WORKER')
          s = s.replace('const STASIS = "/Temp/dnet-stasis.js";\n    const PLAN',
                        'const STASIS = "/Temp/dnet-stasis.js";\n    const LOOT = "/Temp/dnet-loot.js";\n    const PLAN')

          ram_source = r'''    const RAM_WORKER_SOURCE = String.raw`
/** @param {NS} ns */
export async function main(ns) {
    // This worker runs ON the newly-authenticated target. A darknet server is
    // considered directly connected to itself, and scripts are always authenticated
    // to their own host, so no remote session is required here.
    let unchanged = 0;
    let lastBlocked = Number.POSITIVE_INFINITY;
    while (true) {
        let blocked = 0;
        try { blocked = ns.dnet.getBlockedRam(); }
        catch { return; }
        if (!(blocked > 0)) return;
        try {
            const result = await ns.dnet.memoryReallocation();
            if (result && result.code === 454) return;
        } catch { return; }
        let nowBlocked = blocked;
        try { nowBlocked = ns.dnet.getBlockedRam(); }
        catch { return; }
        if (nowBlocked >= lastBlocked - 0.0001) unchanged++;
        else unchanged = 0;
        lastBlocked = nowBlocked;
        if (unchanged >= 8) return;
    }
}
`;

    const STASIS_SOURCE'''
          s, n = re.subn(r'    const RAM_WORKER_SOURCE = String\.raw`.*?`;\n\n    const STASIS_SOURCE', ram_source, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace RAM_WORKER_SOURCE')

          stasis_and_helpers = r'''    const STASIS_SOURCE = String.raw`
/** @param {NS} ns */
export async function main(ns) {
    const shouldLink = String(ns.args[0] ?? "1") !== "0";
    try { await ns.dnet.setStasisLink(shouldLink); }
    catch { }
}
`;

    const LOOT_SOURCE = String.raw`
/** @param {NS} ns */
export async function main(ns) {
    const host = ns.getHostname();
    try {
        const caches = ns.ls(host, ".cache");
        for (const cache of caches) {
            try { ns.dnet.openCache(cache, true); } catch { }
        }
    } catch { }

    try {
        const files = ns.ls(host).filter(function (f) {
            return !f.startsWith("/Temp/dnet-") && !f.endsWith(".cache") && f !== "darknet-passwords.txt";
        });
        for (const file of files) {
            try { await ns.scp(file, "home", host); } catch { }
            if (file.endsWith(".txt")) {
                try {
                    const text = ns.read(file);
                    const safeHost = encodeURIComponent(host).replaceAll("%", "_");
                    const safeFile = encodeURIComponent(file).replaceAll("%", "_");
                    const archive = "/Temp/dnet-loot-" + safeHost + "-" + safeFile;
                    await ns.write(archive, "SOURCE=" + host + "\\nFILE=" + file + "\\n\\n" + text, "w");
                    await ns.scp(archive, "home", host);
                } catch { }
            }
        }
    } catch { }
}
`;

    const PHISH_LAUNCHER_SOURCE = String.raw`
/** @param {NS} ns */
export async function main(ns) {
    const PHISH = "/Temp/dnet-phish.js";
    const host = ns.getHostname();
    try {
        if (ns.ps(host).some(function (p) { return p.filename === PHISH; })) return;
        const ram = ns.getScriptRam(PHISH, host);
        if (!(ram > 0)) return;
        const free = Math.max(0, ns.getServerMaxRam(host) - ns.getServerUsedRam(host));
        const threads = Math.floor(free / ram);
        if (threads > 0) ns.exec(PHISH, host, threads);
    } catch { }
}
`;

    const AGENT_SOURCE'''
          s, n = re.subn(r'    const STASIS_SOURCE = String\.raw`.*?`;\n\n    const AGENT_SOURCE', stasis_and_helpers, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace STASIS_SOURCE')

          # Remove heavyweight local fallback/monitoring from the crawler itself.
          s, n = re.subn(r'    function killPhishers\(\) \{.*?\n    \}\n\n    async function fullyReallocate',
                         '    async function fullyReallocate', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not remove killPhishers')

          lightweight_realloc = r'''    async function fullyReallocate(target) {
        // Run the reallocator ON the target so the crawler does not pay its RAM cost.
        let pid = 0;
        try { pid = ns.exec(RAM_WORKER, target, 1); } catch { pid = 0; }
        if (pid === 0) return;
        for (let i = 0; i < 1200; i++) {
            let blocked = 0;
            try { blocked = ns.dnet.getBlockedRam(target); } catch { return; }
            if (!(blocked > 0)) return;
            await ns.sleep(250);
        }
    }

    async function deployChild'''
          s, n = re.subn(r'    async function fullyReallocate\(target, password\) \{.*?\n    \}\n\n    async function deployChild',
                         lightweight_realloc, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace fullyReallocate')

          deploy = r'''    async function deployChild(target, password) {
        // Authentication already gave this PID a session on the directly-connected target.
        try {
            await ns.scp([AGENT, PHISH, PHISH_LAUNCHER, RAM_WORKER, STASIS, LOOT, PLAN, DB_FILE], target, host);
        } catch { return false; }

        // Free target-owned RAM before installing the persistent crawler.
        await fullyReallocate(target);

        // Loot caches/files while the target is otherwise empty. This lets even 16GB
        // targets run the heavier loot worker before the persistent crawler starts.
        let lootPid = 0;
        try { lootPid = ns.exec(LOOT, target, 1); } catch { lootPid = 0; }
        if (lootPid !== 0) {
            for (let i = 0; i < 600; i++) {
                let running = false;
                try { running = ns.ps(target).some(function (p) { return p.pid === lootPid; }); } catch { }
                if (!running) break;
                await ns.sleep(50);
            }
        }

        try {
            const existing = ns.ps(target).some(function (p) { return p.filename === AGENT; });
            if (existing) return true;
        } catch { }

        try { return ns.exec(AGENT, target, 1, password) !== 0; }
        catch { return false; }
    }

    async function lootSelf'''
          s, n = re.subn(r'    async function deployChild\(target, password\) \{.*?\n    \}\n\n    async function lootSelf',
                         deploy, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace deployChild')

          lootself = r'''    async function lootSelf() {
        // On 16GB hosts this may fail for lack of free RAM; that is fine because
        // deployChild already looted the host before starting this crawler.
        try {
            if (!ns.ps(host).some(function (p) { return p.filename === LOOT; })) ns.exec(LOOT, host, 1);
        } catch { }
    }

    function readPlan'''
          s, n = re.subn(r'    async function lootSelf\(\) \{.*?\n    \}\n\n    function readPlan', lootself, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace lootSelf')

          stasis_func = r'''    async function maybeToggleStasis() {
        if (host === "darkweb") return false;
        const details = getDetails(host);
        if (details && details.isStationary) return false;
        const plan = readPlan();
        if (!plan) return false;
        let linked = [];
        try { linked = ns.dnet.getStasisLinkedServers(false); } catch { return false; }
        const isLinked = linked.includes(host);
        const shouldLink = plan.desired.includes(host);
        if (isLinked === shouldLink) return false;
        try {
            if (ns.ps(host).some(function (p) { return p.filename === STASIS; })) return false;
            ns.exec(STASIS, host, 1, shouldLink ? "1" : "0");
        } catch { }
        return false;
    }

    function ensurePhishing'''
          s, n = re.subn(r'    async function maybeToggleStasis\(\) \{.*?\n    \}\n\n    function ensurePhishing', stasis_func, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace maybeToggleStasis')

          phish_func = r'''    function ensurePhishing() {
        try {
            const busy = ns.ps(host).some(function (p) {
                return p.filename === PHISH || p.filename === PHISH_LAUNCHER;
            });
            if (!busy) ns.exec(PHISH_LAUNCHER, host, 1);
        } catch { }
    }

    async function saveReport'''
          s, n = re.subn(r'    function ensurePhishing\(\) \{.*?\n    \}\n\n    async function saveReport', phish_func, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Could not replace ensurePhishing')

          # Generate and distribute all helper scripts.
          s = s.replace('await ns.write(PHISH, PHISH_SOURCE, "w");\n        await ns.write(RAM_WORKER',
                        'await ns.write(PHISH, PHISH_SOURCE, "w");\n        await ns.write(PHISH_LAUNCHER, PHISH_LAUNCHER_SOURCE, "w");\n        await ns.write(RAM_WORKER')
          s = s.replace('await ns.write(STASIS, STASIS_SOURCE, "w");\n        if (!ns.fileExists',
                        'await ns.write(STASIS, STASIS_SOURCE, "w");\n        await ns.write(LOOT, LOOT_SOURCE, "w");\n        if (!ns.fileExists')
          s = s.replace('[AGENT, PHISH, RAM_WORKER, STASIS, PLAN, DB_FILE]',
                        '[AGENT, PHISH, PHISH_LAUNCHER, RAM_WORKER, STASIS, LOOT, PLAN, DB_FILE]')

          # Report the actual generated crawler RAM before attempting to seed darkweb.
          old = 'await writeWorkers();\n    const db = loadDb();\n    log("Dark Net manager started. Persistent credential DB: " + DB_FILE, true);'
          new = 'await writeWorkers();\n    const agentRam = ns.getScriptRam(AGENT, "home");\n    const db = loadDb();\n    log("Dark Net manager started. Persistent credential DB: " + DB_FILE, true);\n    log("Generated crawler RAM: " + ns.format.ram(agentRam) + " (darkweb capacity: 16 GB).", true);\n    if (agentRam > 16) {\n        log("ERROR: generated crawler still exceeds darkweb RAM; refusing to retry-loop.", true);\n        return;\n    }'
          if old not in s: raise SystemExit('Could not add crawler RAM guard')
          s = s.replace(old, new, 1)
          s = s.replace('Generated crawler/RAM/phishing/stasis workers automatically under /Temp.',
                        'Generated crawler/RAM/loot/phishing/stasis workers automatically under /Temp.', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate main and generated workers
        shell: bash
        run: |
          node --check darknet-manager.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('darknet-manager.js').read_text(encoding='utf-8')
          blocks = re.findall(r'const\s+([A-Z_]+_SOURCE)\s*=\s*String\.raw`(.*?)`;', text, re.S)
          if len(blocks) < 6: raise SystemExit('Expected generated worker blocks were not found')
          for name, src in blocks:
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(src); path=f.name
              subprocess.run(['node','--check',path],check=True)
              print('OK', name)
          agent = dict(blocks).get('AGENT_SOURCE','')
          forbidden = [
              'ns.dnet.openCache', 'ns.dnet.memoryReallocation', 'ns.spawn', 'ns.run', 'ns.kill',
              'ns.getScriptRam', 'ns.getServerMaxRam', 'ns.getServerUsedRam', 'ns.isRunning'
          ]
          bad = [x for x in forbidden if x in agent]
          if bad: raise SystemExit('Heavy APIs still present in AGENT_SOURCE: ' + ', '.join(bad))
          apis = sorted(set(re.findall(r'ns(?:\.[A-Za-z_$][A-Za-z0-9_$]*)+', agent)))
          print('LIGHT AGENT APIS:')
          print('\n'.join(apis))
          PY

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add darknet-manager.js
          git commit -m 'Reduce Dark Net crawler RAM below gateway limit'
          git push

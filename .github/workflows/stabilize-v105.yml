name: Stabilize Dark Net v1.0.5
on:
  push:
    paths:
      - '.github/workflows/stabilize-v105.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/stabilize_v105.py
      - name: Fetch pinned Bitburner v3.0.1 types
        run: |
          mkdir -p types
          curl -fsSL 'https://raw.githubusercontent.com/bitburner-official/bitburner-src/v3.0.1/src/ScriptEditor/NetscriptDefinitions.d.ts' -o types/NetscriptDefinitions.d.ts
      - name: Validate generated code
        run: |
          node --check darknet-manager.js
          node tools/validate-generated-workers.mjs
          node tools/check-bitburner-ram-collisions.mjs
      - name: Install quality tools
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Commit v1.0.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add darknet-manager.js tools types tsconfig.json eslint.config.mjs package.json package-lock.json
          git commit -m 'Stabilize Dark Net automation and integrate formulas tooling'
          git push

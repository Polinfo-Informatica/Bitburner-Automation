name: Format git-pull
on:
  push:
    paths:
      - '.github/workflows/format-git-pull.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write git-pull.js
      - run: npm run check
      - name: Commit formatted updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add git-pull.js
          git diff --cached --quiet && exit 0
          git commit -m "Format Bitburner git-pull updater"
          git push

name: Strict lint migration
on:
  push:
    paths:
      - '.github/workflows/strict-lint-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply source migration
        run: python3 .github/strict_lint_fix.py
      - name: Install/update quality dependencies
        run: npm install --no-audit --no-fund
      - name: Format repository sources
        run: npm run format
      - name: Run complete quality gate
        run: npm run check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add darknet-manager.js darknet-cleanup.js package.json package-lock.json eslint.config.mjs tsconfig.json .prettierrc.json tools
          git diff --cached --quiet && exit 0
          git commit -m "Apply strict lint and Prettier cleanup for v1.0.6"
          git push

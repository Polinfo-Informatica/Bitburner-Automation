name: Install darknet manager

on:
  push:
    paths:
      - '.github/workflows/install-darknet-manager.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate darknet-manager.js
        env:
          PAYLOAD: ''
        run: |
          printf '%s' "$PAYLOAD" | base64 -d | gzip -dc > darknet-manager.js
          node --check darknet-manager.js
      - name: Commit generated script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add darknet-manager.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add darknet-manager.js'
          git push
